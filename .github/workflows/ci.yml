name: ci

# Build and test on GitHub's hosted runners. It runs in the PUBLIC repository only (free minutes there); every commit is
# also gated locally with `pwsh scripts/gate.ps1` before it is published.
#
#   fast      - build, every test without the ExternalDatabase trait (scripts/test-fast.ps1), the licence gate
#   postgres  - the render guard (D30: PostgreSQL is the only provider that reproduces the renderer deadlock class) and
#               the conformance suite's PostgreSQL fixtures, against a job-local PostgreSQL
#   ravendb   - the provider-parity suite (D46: EF Core == RavenDB), against a job-local RavenDB
#
# The service containers' passwords are throwaway values for containers that live and die with the job.
# SQL Server has no job: its suites run in the local full gate (`pwsh scripts/gate.ps1 -Full`).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  fast:
    if: github.repository == 'nova-globen/stomme'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: no-uat-host (D28) and no old names
        shell: bash
        run: |
          # word-boundary match: the bare stem alone would hit "candidates". This file holds the patterns, so it is not
          # searched, and the old host's name is assembled rather than written.
          stem=di; stem="${stem}da"
          if git grep -nIiE "${stem}bit|\\b${stem}(core|deck|bin|game|code)?\\b|\\btond\\b" -- . ':!**/*.lock' ':!**/package-lock.json' ':!.github/workflows/ci.yml'; then
            echo "::error::the old UAT host or an old product name is in the published tree (D28; the owner's no-trace rule)"
            exit 1
          fi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools
      - name: Restore
        run: dotnet restore Stomme.slnx
      - name: Build
        run: dotnet build Stomme.slnx --configuration Release --no-restore -m:4
      - name: Fast tier (every test without the ExternalDatabase trait)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-fast.ps1 -NoBuild -Log "$env:RUNNER_TEMP/fast-tier.log"
      - name: Licence gate (permissive-only, D2)
        if: always()
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-licenses.ps1

  postgres:
    if: github.repository == 'nova-globen/stomme'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_TEST_HOST: 127.0.0.1
      POSTGRES_TEST_PORT: '5432'
      POSTGRES_TEST_USER: postgres
      POSTGRES_TEST_PASSWORD: ci-throwaway-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools
      - name: Build
        run: |
          dotnet build test/Stomme.Tests/Stomme.Tests.csproj --configuration Release
          dotnet build test/Stomme.Persistence.Conformance.Tests/Stomme.Persistence.Conformance.Tests.csproj --configuration Release
      - name: Render guard (D30) - installs a site and asserts it renders
        # Namespace-qualified: a bare ~InstalledSiteRenderTests also selects the RavenDB render tests, which need a store
        # this job does not run and fail rather than skip without one.
        run: >-
          dotnet test test/Stomme.Tests/Stomme.Tests.csproj --configuration Release --no-build
          --filter "FullyQualifiedName~Stomme.Tests.InstalledSiteRenderTests" --blame-hang-timeout 8m
      - name: Conformance suite on PostgreSQL
        if: always()
        run: >-
          dotnet test test/Stomme.Persistence.Conformance.Tests/Stomme.Persistence.Conformance.Tests.csproj --configuration Release --no-build
          --filter "FullyQualifiedName~Postgres" --blame-hang-timeout 8m

  ravendb:
    if: github.repository == 'nova-globen/stomme'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      ravendb:
        image: ravendb/ravendb:7.2.5-ubuntu.24.04-x64
        env:
          RAVEN_Setup_Mode: None
          RAVEN_License_Eula_Accepted: 'true'
          RAVEN_Security_UnsecuredAccessAllowed: PrivateNetwork
        ports:
          - 8080:8080
    env:
      RAVENDB_TEST_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build test/Stomme.Persistence.Conformance.Tests/Stomme.Persistence.Conformance.Tests.csproj --configuration Release
      - name: Wait for RavenDB
        # The parity suite fails rather than skips on an unreachable store, so a start-up race would go red for the
        # wrong reason.
        run: |
          for i in $(seq 1 60); do
            if curl -sf -m 5 http://127.0.0.1:8080/setup/alive >/dev/null 2>&1; then echo "RavenDB is up"; exit 0; fi
            sleep 2
          done
          echo "RavenDB did not become reachable within 120 s" >&2
          exit 1
      - name: Parity suite (D46) - EF Core == RavenDB
        run: >-
          dotnet test test/Stomme.Persistence.Conformance.Tests/Stomme.Persistence.Conformance.Tests.csproj --configuration Release --no-build
          --filter "FullyQualifiedName!~Postgres" --blame-hang-timeout 8m
